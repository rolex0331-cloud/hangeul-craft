<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bean Roasters</title>
<style>
  body { margin:0; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; line-height:1.3; color:#1f1f1f; background:#faf7ff; }
  .hero { padding:56px 20px; background:linear-gradient(135deg,#7c3aed,#db2777); color:#fff; text-align:center; }
  .hero h1 { font-size:34px; margin:0 0 12px; text-transform:uppercase; }
  .hero p { font-size:15px; opacity:.9; }
  .btn { display:inline-block; margin-top:16px; padding:12px 22px; border-radius:999px; background:#fff; color:#7c3aed; font-weight:600; text-decoration:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:20px; }
  .card { background:rgba(255,255,255,.7); border-radius:16px; padding:12px; box-shadow:0 8px 24px rgba(124,58,237,.15); }
  .card .img { height:110px; border-radius:12px; background:#ede9fe; }
  .card h3 { font-size:15px; margin:10px 0 4px; }
  .card .price { color:#7c3aed; font-weight:700; }
  form { padding:20px; }
  label { display:block; font-size:13px; margin-top:10px; }
  input { width:100%; padding:10px; box-sizing:border-box; border:1px solid #ddd; border-radius:8px; }
  footer { padding:20px; font-size:12px; color:#999; text-align:center; }
</style>
</head>
<body>
  <section class="hero">
    <h1>✨ 당신의 하루를 바꿀 스페셜티 커피 원두 정기구독 서비스 ✨</h1>
    <p>우리의 로스터들에 의해 신선하게 로스팅된 원두를 문 앞까지 받아보는 것이 가능합니다. Lorem ipsum dolor sit amet.</p>
    <a class="btn" href="#">Get Started 🚀</a>
  </section>
  <section class="grid">
    <div class="card"><div class="img"></div><h3>에티오피아 예가체프 코체레 G1 워시드</h3><p class="price">$12.99</p></div>
    <div class="card"><div class="img"></div><h3>콜롬비아 수프리모 디카페인 스위스워터</h3><p class="price">$10.99</p></div>
  </section>
  <form>
    <label>First name</label><input>
    <label>Last name</label><input>
    <label>Delivery date</label><input placeholder="10/18/2026">
  </form>
  <footer>© 2026 Bean Roasters. All rights reserved.</footer>
</body>
</html>
